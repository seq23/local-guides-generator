name: Build Starter Pack
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/page_sets/starter_v1.json'
      - 'data/page_sets/examples/starter_global_pages/**'
      - 'data/training/**'
      - 'docs/START_HERE.md'
      - 'docs/LLM_PROMPTS.md'
      - 'scripts/build_starter_pack.js'
jobs:
  build-starter:
    timeout-minutes: 5  # ~3x median 0.1m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/build_starter_pack.js
