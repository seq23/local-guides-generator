name: Complete Promoted Guides

on:
  push:
    branches: [main]
    paths:
      - data/reference/promotion_candidates.source.json
      - data/reference/incoming_candidates.json
      - data/reference/reference_registry.json
      - data/page_sets/examples/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  complete-promoted-guides:
    runs-on: ubuntu-latest
    env:
      PAGE_SET_FILE: data/page_sets/examples/pi_v1.json
      BEFORE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical PAGE_SET_FILE contract
        run: node scripts/validation/pagesetfile_contract.js

      - name: Materialize canonical active pack into data/site.json
        run: npm run prepare:site

      - name: Build completion queue
        run: node scripts/reference/build_completion_queue.js

      - name: Check whether promoted drafts need completion
        id: queue_check
        run: |
          node -e "const q=require('./.tmp/promoted_guide_completion_queue.json'); console.log('has_queue=' + ((q.items||[]).length ? 'true' : 'false'))" >> "$GITHUB_OUTPUT"

      - name: Complete promoted guides
        if: steps.queue_check.outputs.has_queue == 'true'
        run: node scripts/reference/complete_promoted_guides.js

      - name: Sync guides
        if: steps.queue_check.outputs.has_queue == 'true'
        run: npm run sync:guides

      - name: Validate completion lane
        if: steps.queue_check.outputs.has_queue == 'true'
        run: npm run validate:promoted-guide-completion

      - name: Build all packs
        if: steps.queue_check.outputs.has_queue == 'true'
        run: node scripts/build_all_packs.js

      - name: Validate canonical repo after guide completion
        if: steps.queue_check.outputs.has_queue == 'true'
        run: LKG_VALIDATE_DIST=1 npm run validate:all

      - name: Restore transient site state and temp artifacts
        if: always()
        run: |
          git restore data/site.json || true
          git restore releases/fanout_query_clusters.*.json || true
          rm -f .tmp/promoted_guide_completion_queue.json
          git restore reports/phase8_hard_fail_run.json || true

      - name: Create follow-up PR for completed promoted guides
        if: steps.queue_check.outputs.has_queue == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Complete promoted guides from merged intake"
          title: "Complete promoted guides after intake merge"
          body: |
            Automated post-merge completion PR.

            This PR was created after a merged intake branch introduced skeletal promoted guide source files.

            Included lane:
            - build completion queue
            - complete promoted guides into canonical sectioned shape
            - sync guides
            - validate completion lane
            - build all packs
            - validate all

            Review focus:
            - changed guide source files
            - rendered guide quality
            - any unexpected broad diffs
          branch: auto/complete-promoted-guides-${{ github.run_id }}
          delete-branch: true
