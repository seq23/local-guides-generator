name: edge-cache

# Static HTML is served from the Cloudflare edge cache (config/edge_cache.json).
# After every push to main: re-apply the cache rule on each zone (config as
# code), wait until every Pages project has deployed this commit, then purge
# each zone so the new build is what the edge serves. Each step exits non-zero
# unless it acted on every configured zone/project.
#
# Daily too (2026-11-14): the data commits on main are pushed by
# github-actions[bot], and a GITHUB_TOKEN push never triggers this workflow. So
# after one Cloudflare-side deploy failure (49e3774 on -pi, 13 Nov: upload and
# publish logged success, stage marked failure) this lane stayed red until the
# next human push, and bot-pushed builds were never purged. The daily run waits
# for the CURRENT head of main to be deployed on every project and purges.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * *'   # 09:00 CT (CST), after the morning data commits
  workflow_dispatch:

concurrency:
  group: edge-cache
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_EDGE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_CACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply the edge cache rule on every zone
        run: node scripts/cloudflare/apply_edge_cache.js rules
      - name: Wait for every Pages project to deploy this commit
        run: node scripts/cloudflare/apply_edge_cache.js wait "${GITHUB_SHA}"
      - name: Purge every zone
        if: always()
        run: node scripts/cloudflare/apply_edge_cache.js purge
