name: Rotating Refresh

on:
  workflow_dispatch:
    inputs:
      search_only:
        description: "Run only the Search Console measurement steps (no rotation, no paid citation probe)"
        type: boolean
        default: false
  schedule:
    - cron: '30 13 * * *'

permissions:
  contents: write

jobs:
  rotating-refresh:
    timeout-minutes: 25  # ~3x median 5.5m over 8 green runs plus ~3m of Search Console reads; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Search Console truth for the five sites (registered in
      # data/contracts/site_hygiene_registry.json#search_intelligence): query+page
      # analytics (rolling 28 days), sitemaps.list (submit only if none listed) and
      # URL Inspection (150 URLs/site/day, 8 parallel, rotating through the
      # sitemap). Then the CTA click readback and the measured target set,
      # consolidation ledger and strengthening plan. A missing secret is a NAMED
      # STOP line, never a red cycle.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure Search Console truth per site
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth >/dev/null
          python3 scripts/search_intelligence/collect_gsc.py
      - name: Record audience CTA clicks
        run: node scripts/search_intelligence/collect_cta_clicks.mjs
      - name: Rebuild measured targets, consolidation ledger and strengthening plan
        run: node scripts/search_intelligence/build_search_plan.mjs
      - name: Rotate one vertical
        if: ${{ !inputs.search_only }}
        run: node scripts/automation/rotate_vertical_refresh.js
      - name: Observe whether answer engines cite us
        if: ${{ !inputs.search_only }}
        # The probe shipped here and no workflow invoked it, so no citation
        # observation was ever taken. Grounded mode reads the pages the answer
        # was actually built from; knowledge mode would only show whether a
        # model memorised the brand, which is not a citation.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: grounded
        run: node scripts/llm_citation_probe.mjs --limit 25
      - name: Record the observation
        # Stage FIRST, then ask the index whether anything changed. The old
        # guard asked `git diff --quiet -- data/signals/` before staging, and
        # `git diff` is blind to untracked files: the brand-new observations
        # file always read as "no change", so the lane could never take its
        # first commit and four paid grounded runs were thrown away. The probe
        # also writes citation_probe_status.json on every path, including a
        # credential-less named stop, so an empty-handed lane leaves a receipt.
        # CHANGELOG.md carries the rotation entry from the step above and was
        # likewise never staged. data/site.json is deliberately NOT committed:
        # it is transient materialized pack state.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals/ CHANGELOG.md data/search_intelligence/
          if git diff --cached --quiet; then
            echo "no observation or rotation entry to record"
            exit 0
          fi
          git commit -m "Record search truth and citation probe observations $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
