name: Rotating Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'

permissions:
  contents: write

jobs:
  rotating-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/automation/rotate_vertical_refresh.js
      - name: Observe whether answer engines cite us
        # The probe shipped here and no workflow invoked it, so no citation
        # observation was ever taken. Grounded mode reads the pages the answer
        # was actually built from; knowledge mode would only show whether a
        # model memorised the brand, which is not a citation.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: grounded
        run: node scripts/llm_citation_probe.mjs --limit 25
      - name: Record the observation
        # Stage FIRST, then ask the index whether anything changed. The old
        # guard asked `git diff --quiet -- data/signals/` before staging, and
        # `git diff` is blind to untracked files: the brand-new observations
        # file always read as "no change", so the lane could never take its
        # first commit and four paid grounded runs were thrown away. The probe
        # also writes citation_probe_status.json on every path, including a
        # credential-less named stop, so an empty-handed lane leaves a receipt.
        # CHANGELOG.md carries the rotation entry from the step above and was
        # likewise never staged. data/site.json is deliberately NOT committed:
        # it is transient materialized pack state.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals/ CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no observation or rotation entry to record"
            exit 0
          fi
          git commit -m "Record citation probe observations $(date -u +%Y-%m-%d)"
          git push
