name: Rotating Refresh

on:
  workflow_dispatch:
    inputs:
      search_only:
        description: "Run only the Search Console measurement steps (no rotation, no router receipt)"
        type: boolean
        default: false
  schedule:
    - cron: '30 13 * * *'

permissions:
  contents: write

concurrency:
  group: rotating-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rotating-refresh:
    timeout-minutes: 25  # ~3x median 5.5m over 8 green runs plus ~3m of Search Console reads; fault detector, not a budget
    runs-on: ubuntu-latest
    # A newly qualifying family may need an editorial repair. It must fail only
    # its own site's checkpoint, never discard the other sites' completed reads.
    # Serial jobs check out the latest branch tip so their commits do not race.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host:
          - theaccidentguides.com
          - dentistryguides.com
          - neuroevalguides.com
          - hormonesivhair.com
          - uscisexam.com
          - memphisseniorcarehomes.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Search Console truth for the six sites (registered in
      # data/contracts/site_hygiene_registry.json#search_intelligence): query+page
      # analytics (rolling 28 days), sitemaps.list (submit only if none listed) and
      # URL Inspection (150 URLs/site/day, 8 parallel, rotating through the
      # sitemap). Then the CTA click readback and the measured target set,
      # consolidation ledger and strengthening plan. A missing secret is a NAMED
      # STOP line, never a red cycle.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure Search Console truth per site
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth >/dev/null
          python3 scripts/search_intelligence/collect_gsc.py --only "${{ matrix.host }}"
      - name: Record audience CTA clicks
        if: matrix.host == 'memphisseniorcarehomes.com'
        run: node scripts/search_intelligence/collect_cta_clicks.mjs
      - name: Rebuild measured targets, consolidation ledger and strengthening plan
        run: node scripts/search_intelligence/build_search_plan.mjs
      # Save completed measurements before rotation: a content validation failure
      # must not discard successful Search Console reads (e4/e5).
      - name: Record the observation
        # Stage before testing for changes so newly collected files are included.
        # Search-plan data renders into pages: rebase, refresh and commit the
        # content-date ledger, then prove its currency before pushing.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals/ CHANGELOG.md data/search_intelligence/
          if git diff --cached --quiet; then
            echo "no observation or rotation entry to record"
            exit 0
          fi
          git commit -m "Record search truth and citation probe observations $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          # The recorded data renders into pages (each homepage links its strengthened
          # pages), so the lastmod ledger moves with it. Pushing data without the ledger
          # left main red with no run to show it: a GITHUB_TOKEN push triggers no
          # workflow, so the next merge inherited it (30 Oct 2026, #92). Refresh the
          # ledger on the rebased tree, commit it, then prove the commit with a plain
          # build - the currency contract against the committed ledger - before pushing.
          node scripts/build_all_packs.js --refresh-ledger
          git add data/cadence/lastmod_ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page freshness for the $(date -u +%Y-%m-%d) search observations"
          fi
          node scripts/build_all_packs.js
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Rotate one vertical
        if: ${{ !inputs.search_only && matrix.host == 'memphisseniorcarehomes.com' }}
        run: node scripts/automation/rotate_vertical_refresh.js
      - name: LLM cost receipt (zero-paid policy)
        if: ${{ !inputs.search_only && matrix.host == 'memphisseniorcarehomes.com' }}
        # Owner policy 11 Oct 2026: "nothing should be paid ... cut the probes and
        # make them free." The citation probe that ran here daily (grounded,
        # :online, billed per request) is removed from this schedule; it is
        # dispatch-only in citation_probe.yml behind confirm_paid and can only
        # reach $0 models. This step proves the free router on every cycle: one
        # tiny call through scripts/lib/free_llm_router.mjs, which can only send
        # the $0 models in config/llm_routing.json and fails the run if OpenRouter
        # reports a non-zero cost. A dead or missing key is a NAMED STOP line,
        # never a red cycle.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "citation probe: SKIPPED - probe disabled by owner policy (dispatch-only, citation_probe.yml)"
          node scripts/lib/free_llm_router.mjs --ping
      - name: Record the rotation
        if: ${{ !inputs.search_only && matrix.host == 'memphisseniorcarehomes.com' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals/ CHANGELOG.md data/search_intelligence/
          if git diff --cached --quiet; then
            echo "no observation or rotation entry to record"
            exit 0
          fi
          git commit -m "Record search truth and citation probe observations $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          # The recorded data renders into pages (each homepage links its strengthened
          # pages), so the lastmod ledger moves with it. Pushing data without the ledger
          # left main red with no run to show it: a GITHUB_TOKEN push triggers no
          # workflow, so the next merge inherited it (30 Oct 2026, #92). Refresh the
          # ledger on the rebased tree, commit it, then prove the commit with a plain
          # build - the currency contract against the committed ledger - before pushing.
          node scripts/build_all_packs.js --refresh-ledger
          git add data/cadence/lastmod_ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page freshness for the $(date -u +%Y-%m-%d) search observations"
          fi
          node scripts/build_all_packs.js
          git push origin "HEAD:${GITHUB_REF_NAME}"
