name: Deploy Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      page_set_file:
        description: Optional single page set to build and distribute
        required: false
        default: ""
        type: string

jobs:
  distribute:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - name: pi
            page_set_file: data/page_sets/examples/pi_v1.json
            gsc_site: sc-domain:theaccidentguides.com
          - name: dentistry
            page_set_file: data/page_sets/examples/dentistry_v1.json
            gsc_site: sc-domain:dentistryguides.com
          - name: neuro
            page_set_file: data/page_sets/examples/neuro_v1.json
            gsc_site: sc-domain:neuroevalguides.com
          - name: trt
            page_set_file: data/page_sets/examples/trt_v1.json
            gsc_site: sc-domain:hormonesivhair.com
          - name: uscis_medical
            page_set_file: data/page_sets/examples/uscis_medical_v1.json
            gsc_site: sc-domain:uscisexam.com

    steps:
      - name: Skip non-selected matrix pack
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file }}
        run: |
          echo "Skipping ${{ matrix.pack.name }} because workflow_dispatch requested ${{ inputs.page_set_file }}."

      - name: Checkout
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        run: npm ci

      - name: Install optional GSC Python dependencies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) && secrets.GSC_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Recreate optional GSC service account file
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) && secrets.GSC_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          printf '%s' '${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}' > gsc-service-account.json

      - name: Ensure scripts are executable
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        run: |
          chmod +x distribution_scripts/indexnow_submit.sh
          chmod +x distribution_scripts/deploy_distribution.sh
          chmod +x distribution_scripts/gsc_submit_sitemaps.py || true
          chmod +x distribution_scripts/gsc_inspect_urls.py || true

      - name: Build selected pack and distribution artifacts
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        env:
          PAGE_SET_FILE: ${{ matrix.pack.page_set_file }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          npm run build
          npm run validate:indexnow
          ls -l dist/citation-manifest.json dist/indexnow-priority.txt dist/indexnow-batch.txt

      - name: Validate distribution workflow contract
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        run: npm run validate:distribution-workflow

      - name: Run distribution deploy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GSC_SITE_URL: ${{ matrix.pack.gsc_site }}
          GSC_SERVICE_ACCOUNT_JSON_PRESENT: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          ARGS=(--artifact-dir dist)
          if [ -n "$INDEXNOW_KEY" ]; then
            ARGS+=(--key "$INDEXNOW_KEY")
          else
            ARGS+=(--dry-run)
          fi
          if [ "$GSC_SERVICE_ACCOUNT_JSON_PRESENT" = "true" ]; then
            ARGS+=(--creds gsc-service-account.json --gsc-site "$GSC_SITE_URL")
          fi
          ./distribution_scripts/deploy_distribution.sh "${ARGS[@]}"

      - name: Upload distribution reports
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_set_file != '' && inputs.page_set_file != matrix.pack.page_set_file) && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lkg-distribution-${{ matrix.pack.name }}
          path: |
            dist/indexnow-priority.txt
            dist/indexnow-batch.txt
            reports/indexnow-*.json
            reports/distribution-workflow-contract.json
