name: Integrity Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity-build:
    timeout-minutes: 5  # ~3x median 0.7m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/build_all_packs.js
      - run: LKG_VALIDATE_DIST=1 npm run validate:all
