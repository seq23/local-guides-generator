name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 5  # ~3x median 0.7m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline print test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install -r tests/senior/print-requirements.txt
      - run: node scripts/build_all_packs.js
      - name: Binder HTML print layout
        run: python tests/senior/print_layout_test.py
      - run: LKG_VALIDATE_DIST=1 npm run validate:all
      - name: Search loop engine (seq23/search-loop@v1) for the canonical loop's tests
        uses: actions/checkout@v6
        with:
          repository: seq23/search-loop
          ref: 569a5be18e851fafedea729b729a4621fd102d46 # compatible pace API; immutable v1.2.6
          path: .search-loop-engine
      - name: Canonical search loop (missing guides, gate, cadence cap, report shape)
        run: npm run test:search-loop
      - name: Scoped Search Readiness repair pins
        run: npm run test:search-readiness
      - name: IndexNow named stop pins
        # Deploy Distribution may exit 0 on an IndexNow 403 ONLY as the named
        # stop INDEXNOW_SITE_NOT_YET_VERIFIED (live key file exact). These
        # fixtures prove every other 403/status still fails.
        run: npm run test:indexnow-named-stop
      - name: Free LLM router 403 pins
        # A 403/404 for one $0 model falls through to the next; only 401, 402,
        # a key-shaped message or a failed key check is a credential stop.
        run: npm run test:llm-router
      - name: Refresh lane (real changes only, R-ADV-12)
        # Dead links unwrapped, one real-search question under fact guards,
        # rendered into the page and its one FAQPage; dates never written.
        run: npm run test:refresh-lane
      - name: Link audit pins
        # Dead outbound URL list, /cdn-cgi/l/email-protection hrefs and bare
        # email text outside an email_off fence each fail a fixture page.
        run: npm run test:link-audit
      - name: Edge cache config pins
        # Static HTML stays edge-cacheable: only /api/* reaches Functions, no
        # middleware, pages.dev noindex via _headers, a cache rule per canonical zone.
        run: npm run test:edge-cache
      - name: Entity graph and backlink watch pins
        # sameAs is external profiles only (never this site, the umbrella or a
        # sibling), the Organization node matches data/entity/<pack>/entity.json,
        # no Person without written consent, the editorial byline on every content
        # page, and the weekly watch's dead/promote/named-stop decisions.
        run: npm run test:entity-graph
      - name: Structured data vocabulary pins
        # Organization-only properties on WebSite, unknown types/properties and
        # zero-node pages each fail a fixture.
        run: npm run test:structured-data
      - name: Request form own-vertical pins
        # Each guide site's forms open on its own service, pre-selected; every
        # lead carries vertical_key and the page it came from (25 Oct 2026).
        run: npm run test:request-form-own-vertical
      - name: lastmod source resolution pins
        # A page's freshness date comes from that page's own content: the pack
        # page set is not a source, a shared manifest is read through a per-page
        # slice, and a meta_title edit is not a content change. Each property
        # failed before 26 Oct 2026, when one commit to a pack manifest put the
        # same lastmod on every city, state and guide URL of four sites.
        run: npm run test:lastmod-sources
      - name: Lead storage failure and fallback pins
        run: node --test tests/request_form/storage_failure_paths.test.mjs

      - name: Lead gate pins
        # Both public lead endpoints: no Turnstile token 400, rejected token 403, no
        # secret 503, over the per-IP or per-site daily limit 429; a new senior lead is
        # routed (follow-ups, seat offer, teasers) only after the family confirms (3 Nov 2026).
        run: npm run test:lead-guard

      - name: Blocked lead domains pins
        # A form email on BLOCKED_LEAD_DOMAINS (Pages env var only) is dropped
        # quietly: no storage, no email, one log line, honeypot answer (26 Oct 2026).
        run: npm run test:blocked-lead-domains

      - name: National market evidence gate regression
        run: node --test tests/operations/evidence_gated_market_queue.test.cjs

      - name: Warning tier
        # The tiering policy defines three tiers and the repo ships a runner for
        # each, but only hard_fail was ever invoked: the 8 warning-tier
        # validators were reachable only through `npm run qa:final`, which no
        # workflow runs either. A warning tier that never runs emits no
        # warnings, which is the whole point of it. Reported, never blocking --
        # that is what the tier means, and it is why this is safe to add.
        continue-on-error: true
        run: LKG_VALIDATE_DIST=1 npm run validate:tier:warning

      - name: Cadence gate (merge lane)
        # Freshness and lastmod rules block here. The weekly new-page cap is
        # reported only: it limits publishing, so the search loop's publish
        # lane holds it (owner ruling 2 Nov 2026).
        run: npm run cadence:gate -- --lane merge
