name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 5  # ~3x median 0.7m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/build_all_packs.js
      - run: LKG_VALIDATE_DIST=1 npm run validate:all
      - name: IndexNow named stop pins
        # Deploy Distribution may exit 0 on an IndexNow 403 ONLY as the named
        # stop INDEXNOW_SITE_NOT_YET_VERIFIED (live key file exact). These
        # fixtures prove every other 403/status still fails.
        run: npm run test:indexnow-named-stop
      - name: Free LLM router 403 pins
        # A 403/404 for one $0 model falls through to the next; only 401, 402,
        # a key-shaped message or a failed key check is a credential stop.
        run: npm run test:llm-router
      - name: Link audit pins
        # Dead outbound URL list, /cdn-cgi/l/email-protection hrefs and bare
        # email text outside an email_off fence each fail a fixture page.
        run: npm run test:link-audit
      - name: Edge cache config pins
        # Static HTML stays edge-cacheable: only /api/* reaches Functions, no
        # middleware, pages.dev noindex via _headers, a cache rule per canonical zone.
        run: npm run test:edge-cache
      - name: Structured data vocabulary pins
        # Organization-only properties on WebSite, unknown types/properties and
        # zero-node pages each fail a fixture.
        run: npm run test:structured-data
      - name: Request form own-vertical pins
        # Each guide site's forms open on its own service, pre-selected; every
        # lead carries vertical_key and the page it came from (25 Oct 2026).
        run: npm run test:request-form-own-vertical

      - name: Warning tier
        # The tiering policy defines three tiers and the repo ships a runner for
        # each, but only hard_fail was ever invoked: the 8 warning-tier
        # validators were reachable only through `npm run qa:final`, which no
        # workflow runs either. A warning tier that never runs emits no
        # warnings, which is the whole point of it. Reported, never blocking --
        # that is what the tier means, and it is why this is safe to add.
        continue-on-error: true
        run: LKG_VALIDATE_DIST=1 npm run validate:tier:warning

      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        run: npm run cadence:gate
