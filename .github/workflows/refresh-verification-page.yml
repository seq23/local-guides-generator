name: Refresh Verification Page

on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-verification-page
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Bootstrap site state if missing
        run: |
          python - <<'PY'
          import json
          import pathlib
          site_path = pathlib.Path('data/site.json')
          if not site_path.exists():
              site_path.write_text(
                  json.dumps({
                      "brandName": "USCIS Exam Guides",
                      "siteUrl": "https://uscisexam.com",
                      "pageSetFile": "data/page_sets/examples/uscis_medical_v1.json"
                  }, indent=2) + "\n"
              )
          PY

      - name: Refresh dist/verification + dependent artifacts
        run: |
          npm run refresh:verification

      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh verification page"
          git pull --rebase origin main || true
          git push
