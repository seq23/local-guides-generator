name: Promote Reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/reference/generate_from_candidates.js
