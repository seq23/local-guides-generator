name: Promote Reference

on:
  pull_request:
    paths:
      - data/reference/promotion_candidates.source.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-reference:
    runs-on: ubuntu-latest
    env:
      PAGE_SET_FILE: data/page_sets/examples/pi_v1.json
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical PAGE_SET_FILE contract
        run: node scripts/validation/pagesetfile_contract.js

      - name: Materialize canonical active pack into data/site.json
        run: npm run prepare:site

      - name: Pull candidate payload into incoming queue
        run: node scripts/reference/pull_velocity_candidates.js

      - name: Generate draft guide sources from candidates
        run: node scripts/reference/generate_from_candidates.js

      - name: Sync guide hubs and canonical guide docs
        run: npm run sync:guides

      - name: Build all packs before validation
        run: node scripts/build_all_packs.js

      - name: Validate canonical repo after draft generation
        run: LKG_VALIDATE_DIST=1 npm run validate:all

      - name: Commit generated draft guides back to PR branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add \
            data/site.json \
            data/reference/incoming_candidates.json \
            data/reference/reference_registry.json \
            data/page_sets/examples \
            docs/_generated_guides
          git diff --cached --quiet && exit 0
          git commit -m "Generate draft guide sources from velocity candidates"
          git push
