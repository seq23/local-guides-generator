name: Distribution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distribution:
    timeout-minutes: 30  # no successful run history yet; default ceiling, revisit once it has runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run distribution:prepare
