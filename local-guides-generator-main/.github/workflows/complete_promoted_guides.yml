name: Complete Promoted Guides

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  complete-promoted-guides:
    runs-on: ubuntu-latest
    env:
      PAGE_SET_FILE: data/page_sets/examples/pi_v1.json

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical PAGE_SET_FILE contract
        run: node scripts/validation/pagesetfile_contract.js

      - name: Materialize canonical active pack into data/site.json
        run: npm run prepare:site

      - name: Build completion queue
        run: node scripts/reference/build_completion_queue.js

      - name: Read completion queue size
        id: queue
        run: |
          COUNT=$(node -e "const fs=require('fs'); const p='reports/promoted_guide_completion_queue.json'; if(!fs.existsSync(p)){process.stdout.write('0'); process.exit(0);} const data=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(String((data.items||[]).length));")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Completion queue size: $COUNT"

      - name: Exit cleanly when there is nothing to complete
        if: steps.queue.outputs.count == '0'
        run: |
          echo "No skeletal promoted guides detected. Nothing to do."
          exit 0

      - name: Complete promoted guides
        if: steps.queue.outputs.count != '0'
        run: node scripts/reference/complete_promoted_guides.js

      - name: Sync guides
        if: steps.queue.outputs.count != '0'
        run: npm run sync:guides

      - name: Validate promoted guide completion lane
        if: steps.queue.outputs.count != '0'
        run: node scripts/validation/promoted_guide_completion_contract.js

      - name: Build all packs
        if: steps.queue.outputs.count != '0'
        run: node scripts/build_all_packs.js

      - name: Run full validation
        if: steps.queue.outputs.count != '0'
        run: LKG_VALIDATE_DIST=1 npm run validate:all

      - name: Restore transient build state
        if: steps.queue.outputs.count != '0'
        run: |
          git restore data/site.json || true
          git restore dist || true
          git restore releases/fanout_query_clusters.positive.json || true
          git restore releases/fanout_query_clusters.negative.json || true
          git restore reports/phase8_hard_fail_run.json || true
          rm -f reports/promoted_guide_completion_queue.json

      - name: Create follow-up PR for completed guides
        if: steps.queue.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/complete-promoted-guides-${{ github.run_id }}
          title: Complete promoted guides — ${{ github.run_id }}
          commit-message: Complete promoted skeletal guides after intake merge
          body: |
            Automated post-merge completion PR.

            This PR was created after a merged intake change on `main`.
            It:
            - detected newly merged skeletal promoted guide source files
            - completed them into canonical production-shaped guide source
            - synced guide surfaces
            - passed the promoted-guide completion contract
            - passed full build + validation

            Review and merge if the completed guide source changes look correct.
          labels: |
            automated
            guide-completion
          delete-branch: true
          add-paths: |
            data/page_sets/examples/dentistry_global_pages/*.json
            data/page_sets/examples/neuro_global_pages/*.json
            data/page_sets/examples/pi_global_pages/*.json
            data/page_sets/examples/trt_global_pages/*.json
            data/page_sets/examples/uscis_medical_global_pages/*.json
            docs/_generated_guides/**
